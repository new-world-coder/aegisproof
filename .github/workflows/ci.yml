name: CI

on:
  push:
    branches: [main, master, cursor/aegisproof-v0.1-spec-and-cli]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test
        run: go test ./...
      - name: Verify examples
        run: |
          go run ./cmd/aegisproof verify ./examples/minimal
          go run ./cmd/aegisproof verify ./examples/rag-claims
      - name: Conformance invalid must fail
        run: |
          set +e
          for case in bad-digest missing-file path-traversal bad-spec-version duplicate-id; do
            go run ./cmd/aegisproof verify "./conformance/v0.1/invalid/$case"
            test $? -eq 1 || exit 1
          done
