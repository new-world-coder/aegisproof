name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test
        run: go test ./...
      - name: Verify examples
        run: |
          go run ./cmd/aegisproof verify ./examples/minimal
          go run ./cmd/aegisproof verify ./examples/rag-claims
      - name: Conformance invalid must fail
        run: |
          set +e
          go run ./cmd/aegisproof verify ./conformance/v0.1/invalid/bad-digest
          test $? -eq 1
          go run ./cmd/aegisproof verify ./conformance/v0.1/invalid/path-traversal
          test $? -eq 1
